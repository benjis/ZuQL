- id: order_mrr
  name: Order Mrr
  documentation_path: "/zuora-platform/data/zuora-reporting/data-sources-and-exports/data-source-reference/order-mrr-data-source"
  availability: Part of the Orders feature. Available for use in data source exports
    and reports.
  availability_modes:
  - exports
  - reports
  feature_notes:
  - Orders
  deprecated: false
  page_title: Order Mrr data source
  description: Data source to report on how order actions change Monthly Recurring
    Revenue (MRR) for a subscription.
  base_objects:
  - name: Order Mrr
    description: The following Order Metrics have been deprecated. Any new customers
      who onboard on Orders or Orders Harmonization will not get these metrics. Existing
      Orders customers who have these metrics will continue to be supported.
    fields:
    - name: The Order ELP and Order Item objects
    - name: The "Generated Reason" and "Order Item ID" fields in the Order MRR, Order
        TCB, Order TCV, and Order Quantity objects
    - name: Created By ID
      description: The Zuora user who created the metric.
    - name: Created Date
      description: The date when the metric was created.
    - name: Discount Charge ID
      description: The internal ID of the discount charge. Only applicable if Type
        is "Discount".
    - name: End Date
      description: The latest date that the metric applies.
    - name: Generated Reason
      description: 'The reason why the metrics are generated by the certain order
        action. The value can be one of the following: IncreaseQuantity - Update Product
        by increasing the quantity DecreaseQuantity - Update Product by decreasing
        the quantity ChangePrice - Update Product by changing the price Extension
        - Create Subscription, Renewal, Extend Term, Add Product, or Resume Contraction
        - Cancellation, Remove Product, Shrink Term, or Suspend IncreaseQuantity,
        DecreaseQuantity, and ChangePrice indicate changes in terms of value while
        Extension and Contraction indicate changes in terms of time period.'
    - name: ID
      description: The internal ID of the metric.
    - name: In the case of an OwnerTansfer order action, Zuora creates two Order Mrr
        metrics
      description: 'An Order Mrr metric where "Order Mrr: Invoice Owner ID" represents
        the account that was billed for the subscription before the transfer of ownership.
        An Order Mrr metric where "Order Mrr: Invoice Owner ID" represents the account
        that is billed for the subscription after the transfer of ownership. The values
        of these Order Mrr metrics have opposite signs.'
    - name: Order Item ID
      description: The ID of the order item referenced by the order metrics.
    - name: Start Date
      description: The earliest date that the metric applies.
    - name: Subscription Owner ID
      description: 'The internal ID of the customer account that owns the subscription.
        In the case of an OwnerTansfer order action, Zuora creates two Order Mrr metrics:
        An Order Mrr metric where "Order Mrr: Subscription Owner ID" represents the
        account that owned the subscription before the transfer of ownership. An Order
        Mrr metric where "Order Mrr: Subscription Owner ID" represents the account
        that owns the subscription after the transfer of ownership. The values of
        these Order Mrr metrics have opposite signs.'
    - name: Term Number
      description: A number that tells you the position of a term in a subscription,
        in the context of a recurring business. When a subscription is renewed, the
        term number will increase by one.
    - name: Type
      description: If Type is "Regular", the metric represents the MRR of a regular
        charge. If Type is "Discount", the metric represents the MRR of a discount
        charge that is applied to a regular charge. To obtain information about the
        regular charge, use the Rate Plan Charge object in the data source.
    - name: Updated By ID
      description: The Zuora user who last updated the metric.
    - name: Updated Date
      description: The date when the metric was last updated.
    - name: Value
      description: The monthly recurring revenue associated with the charge. This
        value could be negative or positive, depending on the value of Type and the
        purpose of the order action. For example, if Type is "Regular" and the order
        action is reducing the price of the product, this value is negative.
  related_objects:
  - name: Account
    description: 'Information about the customer account that owns the order. This
      account may not be the account that owns the subscription or is billed for the
      subscription. You can use the "Order Mrr: Subscription Owner ID" field to determine
      which account owns the subscription. You can use the "Order Mrr: Invoice Owner
      ID" field to determine which account is billed for the subscription.'
    fields: []
  - name: Amendment
    description: The amendment that is tied to the rate plan, if applicable.
    fields: []
  - name: Bill To
    description: The contact associated with the account to whom your product or service
      is billed.
    fields: []
  - name: Default Payment Method
    description: The default payment method used to make payments.
    fields: []
  - name: Order
    description: The order you want to see the MRR metrics for.
    fields: []
  - name: Order Action
    description: The order action you want to see the MRR metrics for.
    fields: []
  - name: Parent Account
    description: Refers to the parent account associated with the customer account,
      if applicable.
    fields: []
  - name: Product
    description: 'The product information. Contains the following fields:'
    fields:
