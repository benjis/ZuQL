- id: payment_transaction_log
  name: Payment Transaction Log
  documentation_path: "/zuora-platform/data/zuora-reporting/data-sources-and-exports/data-source-reference/payment-transaction-log-data-source"
  availability: Available for use in data source exports and reports.
  availability_modes:
  - exports
  - reports
  feature_notes: []
  deprecated: false
  page_title: Payment Transaction Log data source
  description: Data source to export a log of all transactions from Zuora to the Gateway
    for the Payment Use this data source to export a log of all transactions from
    Zuora to the Gateway for the Payment. This data source includes the request string,
    the response string and the related payment, the payment method, and the account.
    The credit card number is masked in the request and response strings.
  base_objects:
  - name: Payment Transaction Log
    description: 'This is the base Zuora object for the Payment Transaction Log data
      source export and includes the following fields:'
    fields:
    - name: AVS Response Code
    - name: Batch ID
    - name: Created Date
      description: If Zuora Fraud Protection is enabled,the data screening date is
        also contained in this field, in addition to the transaction creation date.
        Results for fraud protection and gateway services are in separate rows for
        clarity.
    - name: CVV Response Code
    - name: Gateway
      description: If Zuora Fraud Protection is enabled, the value Zuora_Fraud_Protection_MSDFP
        is also contained in this field, in addition to the name of the gateway integration.
        Results for fraud protection and gateway services are in separate rows for
        clarity.
    - name: Gateway Response Code
      description: If Zuora Fraud Protection is enabled, the data screening result
        from the fraud protection service is also contained in this field, in addition
        to the response code from the gateway. Results for fraud protection and gateway
        services are in separate rows for clarity.
    - name: Gateway Response Code Description
      description: If Zuora Fraud Protection is enabled, the data screening message
        from the fraud protection service is also contained in this field, in addition
        to the response message from the gateway. Results for fraud protection and
        gateway services are in separate rows for clarity.
    - name: Gateway State
    - name: Gateway Transaction ID
    - name: Gateway Transaction Type Authorization
      description: 'Payment method creation and update. Capture: Used for delayed
        capture. Sale: Payment creation. Void: Void sale (not void authorization).
        Credit: Not used. Inquiry: Used for the inquiry call in the payment detail
        page. RefundAuthorize: Not used. Refund: Refund. VoidAuth: Voids payment method
        authorization for a credit card. Validate: No longer used. Was used for Spectrum
        when the authorization amount was 0. Deposit: No longer used. Was used as
        a batch operation to capture by Spectrum. NonReferenceRefund: Refund credit
        balance.'
    - name: Request String
    - name: Response String
    - name: Service Type
      description: If Zuora Fraud Protection is enabled, the value is FraudService.
        Otherwise, the value is empty.
    - name: Transaction Date
    - name: Transaction Log ID
