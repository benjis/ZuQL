        IncreaseQuantity - Update Product by increasing the quantity DecreaseQuantity
        - Update Product by decreasing the quantity ChangePrice - Update Product by
        changing the price Extension - Create Subscription, Renewal, Extend Term,
        Add Product, or Resume Contraction - Cancellation, Remove Product, Shrink
        Term, or Suspend IncreaseQuantity, DecreaseQuantity, and ChangePrice indicate
        changes in terms of value while Extension and Contraction indicate changes
        in terms of time period.'
    - name: ID
      description: The internal ID of the metric.
    - name: Invoice Owner ID
      description: 'The internal ID of the customer account that is billed for the
        subscription. In the case of an OwnerTransfer order action, Zuora creates
        two Order Elp metrics: An Order Elp metric where "Order Elp: Invoice Owner
        ID" represents the account that was billed for the subscription before the
        transfer of ownership. An Order Elp metric where "Order Elp: Invoice Owner
        ID" represents the account that is billed for the subscription after the transfer
        of ownership. The values of these Order Elp metrics have opposite signs.'
    - name: Order Item ID
      description: The ID of the order item referenced by the order metrics.
    - name: Start Date
      description: The earliest date that the metric applies.
    - name: Subscription Owner ID
      description: 'The internal ID of the customer account that owns the subscription.
        In the case of an OwnerTansfer order action, Zuora creates two Order Elp metrics:
        An Order Elp metric where "Order Elp: Subscription Owner ID" represents the
        account that owned the subscription before the transfer of ownership. An Order
        Elp metric where "Order Elp: Subscription Owner ID" represents the account
        that owns the subscription after the transfer of ownership. The values of
        these Order Elp metrics have opposite signs.'
    - name: Term Number
      description: A number that tells you the position of a term in a subscription,
        in the context of a recurring business. When a subscription is renewed, the
        term number will increase by one.
    - name: Tax
      description: The tax amount in the metric when the tax permission is enabled.
        The tax calculation during the Order creation or Orders migration is an estimated
        tax amount that may differ during the invoice process. Some of the reasons
        it may differ are address changes, tax rates, and tax exempt status. The field
        is not updated at invoicing time, and remains the estimated amount that was
        calculated during the Order creation or migration. You can stop this tax field
        from being generated through a subscription setting called "Calculate Tax
        for TCB and ELP Metrics?".
    - name: Type
      description: The type is always "Regular".
    - name: Updated By ID
      description: The Zuora user who last updated the metric.
    - name: Updated Date
      description: The date when the metric was last updated.
    - name: Value
      description: The extended list price calculated by the original product catalog
        list price multiplied by the delta quantity.
