- id: order
  name: Order
  documentation_path: "/zuora-platform/data/zuora-reporting/data-sources-and-exports/data-source-reference/order-data-source"
  availability: Part of the Orders feature. Available for use in data source exports
    and reports.
  availability_modes:
  - exports
  - reports
  feature_notes:
  - Orders
  deprecated: false
  page_title: Order data source
  description: Data source to report on information for a given order.
  base_objects:
  - name: Order
    description: 'Contains the following fields: The following five fields have values
      only when the Revert Order order action is performed. If you manually revert
      order A, order B is automatically generated.'
    fields:
    - name: Category
    - name: Created By ID
    - name: Created Date
    - name: Created By Migration
      description: A Boolean value. The value "true" indicates this order is auto-generated
        by the system for a subscription or amendment created through the Subscribe
        and Amend UI and APIs.
    - name: Description
    - name: ID
    - name: Is Scheduled
      description: Whether the order is a scheduled order.
    - name: Order Date
    - name: Order Number
    - name: Reverted By Order Id
      description: This value is available on order A and indicates the ID of order
        B.
    - name: Reversion Order
      description: This value indicates whether this order reverts another order.
        If this order is order B, the value is TRUE; otherwise, it is FALSE.
    - name: Reverted Date
      description: This value is available on order A and indicates the execution
        date of the Revert Order order action.
    - name: Reverted Order Id
      description: This value is available on order B and indicates the ID of order
        A.
    - name: Reverted Order Number
      description: This value is available on order B and indicates the order number
        of order A.
    - name: Scheduled Date
      description: The date when the scheduled order is executed and completed.
    - name: Scheduled Date Policy
      description: The value must be "SpecificDate".
    - name: State
      description: The Order state. The possible value is Executing, Complete, or
        Canceled.
    - name: Status
      description: The Order status. The possible value is Draft, Pending, Completed,
        Cancelled, Scheduled, Executing, Failedor Reverted.
    - name: Updated By ID
    - name: UpdatedDate
    - name: Custom Fields
  related_objects:
  - name: Account
    description: The customer account information. Note this is the Subscription Owner
      account.
    fields: []
