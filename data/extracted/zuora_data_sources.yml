  base_objects:
  - name: Payment Method Transaction Log
    description: 'This is the base Zuora object for the Payment Method Transaction
      Log data source export and includes the following fields: Note: Results for
      fraud protection and gateway services are in separate rows for clarity.'
    fields:
    - name: Gateway If Zuora Fraud Protection (ZFP) is enabled, the value Zuora_Fraud_Protection_LexisNexis
        is also contained in this field, in addition to the name of the gateway integration.
        If the Bank Account Verification (BAV) solution is enabled, the value StripeFC
        is also contained in this field, in addition to the name of the gateway integration.
        For clarity, the results for Bank Account Verification and gateway services
        are in separate rows.
    - name: Gateway Response Code If Zuora Fraud Protection is enabled, the policy
        score is contained in this field, in addition to the response code from the
        gateway.
    - name: Gateway Response Code Description If Zuora Fraud Protection is enabled,
        the data screening message from the fraud protection service is also contained
        in this field, in addition to the response message from the gateway. If Bank
        Account Verification is enabled, the verification message is provided in the
        field.
    - name: Gateway Transaction ID
    - name: Gateway Transaction Type If Zuora Fraud Protection is enabled, the value
        ZuoraFraudDetection or BankEvent is contained in the field, in addition to
        the name of the gateway integration. Results for fraud protections and gateway
        services are in separate rows. If Bank Account Verification is enabled, the
        value GetAccountAuthData or GetAccountBalance is contained in this field,
        in addition to the message from the gateway. For ThreeDS2EnrollCheck transactions
        on BlueSnap, see Additional information about 3DS2 enroll check .
    - name: IP Address
      description: This is an integer field. Convert the value to a string if required.
    - name: Request String
    - name: Response String
    - name: Transaction Date
    - name: Transaction Log ID
    - name: Device Id
      description: If Zuora Fraud Protection is enabled, the value of ThreatMetrix
        ExactID is displayed in the field.
    - name: Hosted Page Id
      description: The ID of the hosted payment method page
    - name: Service Type If Zuora Fraud Protection is enabled, the value is FraudService.
        Otherwise, the value is empty.
