- id: rate_plan_charge
  name: Rate Plan Charge
  documentation_path: "/zuora-platform/data/zuora-reporting/data-sources-and-exports/data-source-reference/rate-plan-charge-data-source"
  availability: Available for use in data source exports and reports.
  availability_modes:
  - exports
  - reports
  feature_notes: []
  deprecated: false
  page_title: Rate Plan Charge data source
  description: Data source to export charges on subscriptions Use this data source
    to export charges on subscriptions, representing individual streams of charges
    that the subscription will generate (for example, usage, recurring, one-time).
    Each subscription charge represents a row in the export, and this data can be
    combined with associated data such as Accounts, Subscriptions, and Product Catalog.
  base_objects:
  - name: Rate Plan Charge
    description: Fields on a rate plan charge. It includes the following fields. See
      the field description in the Rate Plan Charge object reference. Before the charge
      is billed, the value of the Charged Through Date field is null. The following
      fields are only available if you have the Prepaid with Drawdown feature enabled.
    fields:
    - name: Accounting Code
    - name: Apply Discount To
    - name: Bill Cycle Day
    - name: Bill Cycle Type
    - name: Billing Period
    - name: Billing Period Alignment
    - name: Billing Timing
    - name: Charge Model
    - name: Charge Number
    - name: Charge Type
    - name: Charged Through Date
      description: The date through which a customer has been billed for the charge.
    - name: Created By ID
    - name: Created Date
    - name: Credit Option
    - name: DMRC
    - name: DTCV
    - name: Description
    - name: Discount Level
    - name: Effective End Date
    - name: Effective Start Date
    - name: End Date Condition
    - name: Exclude Item Booking from Revenue
      description: Specifies whether to exclude non-revenue related rate plan charges
        and order line items from syncing to Zuora Revenue. This field is only available
        if you have enabled the Order to Revenue feature or the Billing - Revenue
        Integration feature. The Order to Revenue feature or the Billing - Revenue
        Integration feature only supports the billing-based revenue recognition for
        fixed-amount discounts. Booking transactions must be excluded from revenue
        accounting. You can exclude the booking transactions by setting the Exclude
        Item Booking from Revenue Accounting field.
    - name: Exclude Item Billing from Revenue
      description: Specifies whether to exclude non-revenue related invoice items,
        invoice item adjustments, credit memo items, and debit memo items from syncing
        to Zuora Revenue. This field is only available if you have enabled Zuora Billing
        - Revenue Integration.
    - name: ID
    - name: Invoice Owner ID
      description: the invoice owner ID of the subscription that contains the rate
        plan charge
    - name: Is Last Segment
    - name: Is Processed
      description: It indicates whether a charge segment has been completely billed
        for all its relevant billing periods. This is determined by whether the End
        Date of the charge is earlier than or equal to the Target Date when generating
        invoices.
    - name: List Price Base
    - name: MRR
    - name: Name
    - name: Number of Periods
    - name: Number of Deliveries
      description: dedicated to the Delivery Pricing charges
    - name: Original ID
    - name: Overage Calculation Option
    - name: Overage Unused Units Credit Option
    - name: Payment Term Snapshot
    - name: Price Change Option
    - name: Price Increase Percentage
    - name: Processed Through Date
      description: The date until when charges have been processed. When billing in
        arrears, such as usage, this field value is the same as the ChargedThroughDate
        value. This date is the earliest date when a charge can be amended.
    - name: Quantity
      description: the value is always 1 for the Delivery Pricing charges
    - name: Reflect Discount In Net Amount
      description: indicates whether reflects the net amount of the Delivery Pricing
        charges after a percentage discount
    - name: Rating Group
    - name: Revenue Recognition Code
    - name: Revenue Recognition Rule Name
    - name: Revenue Recognition Trigger Condition
    - name: Sales Price
      description: The sales price associated with the rate plan charge expressed
        as a decimal. For field explanation, see Retrieve a rate plan charge of Object
        Query.
    - name: Segment
    - name: Subscription ID
      description: the ID of the subscription that contains the rate plan charge
    - name: Subscription Owner ID
      description: the subscription owner ID of the subscription that contains the
        rate plan charge
    - name: Specific Billing Period
    - name: Specific End Date
    - name: TCV
    - name: Tax Code Name
    - name: Tax Mode Option
    - name: Taxable
    - name: Trigger Date
    - name: Trigger Event
    - name: Unit of Measure
    - name: Up To Periods
    - name: Up To Periods Type
    - name: Updated By ID
    - name: Updated Date
      description: The default behavior is that when Charged Through Date, Processed
        Through Date, or Is Processed is updated, the value of Updated Date for the
        Rate Plan Charge does not change. If you want the Updated Date field to change
        when Charged Through Date, Processed Through Date, or Is Processed is updated,
        submit a request at Zuora Global Support.
    - name: Version
    - name: Weekly Bill Cycle Day
    - name: Is Prepaid
    - name: Prepaid Operation Type
    - name: Prepaid UOM
    - name: Prepaid Quantity
    - name: Prepaid Total Quantity
    - name: Validity Period Type
    - name: Credit Option
    - name: Drawdown UOM
    - name: Drawdown Rate
  related_objects:
