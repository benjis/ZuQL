- id: prepaid_balance_fund
  name: Prepaid Balance Fund
  documentation_path: "/zuora-platform/data/zuora-reporting/data-sources-and-exports/data-source-reference/prepaid-balance-fund-data-source"
  availability: Part of the Prepaid with Drawdown feature. Available for use in data
    source exports and reports.
  availability_modes:
  - exports
  - reports
  feature_notes:
  - Prepaid with Drawdown
  deprecated: false
  page_title: Prepaid Balance Fund data source
  description: Data source to export the consumption information of your prepaid subscribers.
    Use this data source to export the consumption information of your prepaid subscribers.
    A typical use case of this data source is revenue recognition.
  base_objects:
  - name: Prepaid Balance Fund
    description: ''
    fields:
    - name: ID
      type: string
      description: The identifier.
    - name: Account ID
      type: string
      description: The Account Id.
    - name: Funded Balance
      type: decimal
      description: 'The funded balance: total units of the fund.'
    - name: Balance
      type: decimal
      description: 'Remaining balance on the fund: remaining units of the fund.'
    - name: Funding Price
      type: fixed
      description: 'The price amount of a fund. A rounded value that follows the associated
        invoice owner''s currency rounding rule. Calculation: (Number of Billing Periods
        in one Validity Period) * (Price of one Billing Period)'
    - name: Consumption Amount
      type: decimal
