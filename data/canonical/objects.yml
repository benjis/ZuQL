- id: payment_method_transaction_log
  display_name: Payment Method Transaction Log
  metadata_status: extracted
  fields:
  - id: gateway_if_zuora_fraud_protection_zfp_is_enabled_the_value_zuora_fraud_protection_lexisnexis_is_also_contained_in_this_field_in_addition_to_the_name_of_the_gateway_integration_if_the_bank_account_verification_bav_solution_is_enabled_the_value_stripefc_is_also_contained_in_this_field_in_addition_to_the_name_of_the_gateway_integration_for_clarity_the_results_for_bank_account_verification_and_gateway_services_are_in_separate_rows
    display_name: Gateway If Zuora Fraud Protection (ZFP) is enabled, the value Zuora_Fraud_Protection_LexisNexis
      is also contained in this field, in addition to the name of the gateway integration.
      If the Bank Account Verification (BAV) solution is enabled, the value StripeFC
      is also contained in this field, in addition to the name of the gateway integration.
      For clarity, the results for Bank Account Verification and gateway services
      are in separate rows.
    type: unknown
    source: data_source_html
    source_record: HTML/payment_method_transaction_log.html
  - id: gateway_response_code_if_zuora_fraud_protection_is_enabled_the_policy_score_is_contained_in_this_field_in_addition_to_the_response_code_from_the_gateway
    display_name: Gateway Response Code If Zuora Fraud Protection is enabled, the
      policy score is contained in this field, in addition to the response code from
      the gateway.
    type: unknown
    source: data_source_html
    source_record: HTML/payment_method_transaction_log.html
  - id: gateway_response_code_description_if_zuora_fraud_protection_is_enabled_the_data_screening_message_from_the_fraud_protection_service_is_also_contained_in_this_field_in_addition_to_the_response_message_from_the_gateway_if_bank_account_verification_is_enabled_the_verification_message_is_provided_in_the_field
    display_name: Gateway Response Code Description If Zuora Fraud Protection is enabled,
      the data screening message from the fraud protection service is also contained
      in this field, in addition to the response message from the gateway. If Bank
      Account Verification is enabled, the verification message is provided in the
      field.
    type: unknown
    source: data_source_html
    source_record: HTML/payment_method_transaction_log.html
  - id: gateway_transaction_id
    display_name: Gateway Transaction ID
    type: unknown
    source: data_source_html
    source_record: HTML/payment_method_transaction_log.html
  - id: gateway_transaction_type_if_zuora_fraud_protection_is_enabled_the_value_zuorafrauddetection_or_bankevent_is_contained_in_the_field_in_addition_to_the_name_of_the_gateway_integration_results_for_fraud_protections_and_gateway_services_are_in_separate_rows_if_bank_account_verification_is_enabled_the_value_getaccountauthdata_or_getaccountbalance_is_contained_in_this_field_in_addition_to_the_message_from_the_gateway_for_threeds2enrollcheck_transactions_on_bluesnap_see_additional_information_about_3ds2_enroll_check
    display_name: Gateway Transaction Type If Zuora Fraud Protection is enabled, the
      value ZuoraFraudDetection or BankEvent is contained in the field, in addition
      to the name of the gateway integration. Results for fraud protections and gateway
      services are in separate rows. If Bank Account Verification is enabled, the
      value GetAccountAuthData or GetAccountBalance is contained in this field, in
