    type: unknown
    source: data_source_html
    source_record: HTML/order_tcb.html
    description: 'The reason why the metrics are generated by the certain order action.
      The value can be one of the following: IncreaseQuantity - Update Product by
      increasing the quantity DecreaseQuantity - Update Product by decreasing the
      quantity ChangePrice - Update Product by changing the price Extension - Create
      Subscription, Renewal, Extend Term, Add Product, or Resume Contraction - Cancellation,
      Remove Product, Shrink Term, or Suspend IncreaseQuantity, DecreaseQuantity,
      and ChangePrice indicate changes in terms of value while Extension and Contraction
      indicate changes in terms of time period.'
