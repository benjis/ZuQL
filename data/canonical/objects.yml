  - id: invoice_owner_id
    display_name: Invoice Owner ID
    type: unknown
    source: data_source_html
    source_record: HTML/order_quantity.html
    description: 'The internal ID of the customer account that is billed for the subscription.
      In the case of an OwnerTransfer order action, Zuora creates two Order Quantity
      metrics: An Order Quantity metric where "Order Quantity: Invoice Owner ID" represents
      the account that was billed for the subscription before the transfer of ownership.
      An Order Quantity metric where "Order Quantity: Invoice Owner ID" represents
      the account that is billed for the subscription after the transfer of ownership.
      The values of these Order Quantity metrics have opposite signs.'
  - id: order_item_id
    display_name: Order Item ID
    type: unknown
    source: data_source_html
    source_record: HTML/order_quantity.html
