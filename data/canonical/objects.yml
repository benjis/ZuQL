    source_record: HTML/order_tcb.html
    description: The date when the metric was last updated.
  - id: value
    display_name: Value
    type: unknown
    source: data_source_html
    source_record: HTML/order_tcb.html
    description: The monthly recurring revenue associated with the charge. This value
      could be negative or positive, depending on the value of Type and the purpose
      of the order action. For example, if Type is "Regular" and the order action
      is reducing the price of the product, this value is negative.
  source_record: HTML/order_tcb.html
