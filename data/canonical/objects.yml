    display_name: Subscription Owner ID
    type: unknown
    source: data_source_html
    source_record: HTML/order_quantity.html
    description: 'The internal ID of the customer account that owns the subscription.
      In the case of an OwnerTansfer order action, Zuora creates two Order Quantity
      metrics: An Order Quantity metric where "Order Quantity: Subscription Owner
      ID" represents the account that owned the subscription before the transfer of
      ownership. An Order Quantity metric where "Order Quantity: Subscription Owner
      ID" represents the account that owns the subscription after the transfer of
      ownership. The values of these Order Quantity metrics have opposite signs.'
  - id: term_number
    display_name: Term Number
    type: unknown
    source: data_source_html
    source_record: HTML/order_quantity.html
    description: A number that tells you the position of a term in a subscription,
      in the context of a recurring business. When a subscription is renewed, the
      term number will increase by one.
  - id: updated_by_id
    display_name: Updated By ID
    type: unknown
    source: data_source_html
    source_record: HTML/order_quantity.html
    description: The Zuora user who last updated the metric.
  - id: updated_date
    display_name: Updated Date
    type: unknown
    source: data_source_html
    source_record: HTML/order_quantity.html
    description: The date when the metric was last updated.
  - id: value
    display_name: Value
    type: unknown
    source: data_source_html
    source_record: HTML/order_quantity.html
    description: The delta quantity value. This value could be negative or positive,
      depending on the purpose of the order action. For example, if the order action
      is reducing the quantity of the product, this value is negative. The Order Quantity
      metric is only created for non-zero changes in the quantity. Also, if a charge
      is updated on the charge end date or added to the subscription end date, the
      Order Quantity metric will not be generated.
  source_record: HTML/order_quantity.html
